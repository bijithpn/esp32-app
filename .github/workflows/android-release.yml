name: Android Release

on:
  push:
    branches: [main]
    paths:
      - esp32_hub/app/pubspec.yaml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esp32_hub/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle's downloaded plugins/dependencies, so most runs never touch Maven Central (which rate-limits CI with HTTP 429).
      - uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Read version from pubspec
        id: ver
        run: |
          full=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "name=${full%%+*}" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - name: Build release APK
        # Maven Central sometimes answers 429 / 5xx to shared CI runners: retry with a growing pause instead of failing the release.
        run: |
          for attempt in 1 2 3 4; do
            if flutter build apk --release --split-per-abi; then exit 0; fi
            echo "Build attempt $attempt failed; waiting before retrying"
            sleep $((attempt * 45))
          done
          exit 1

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            mv "$f" "esp32_hub-${{ steps.ver.outputs.name }}-${f#app-}"
          done
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: esp32-hub-apk-${{ steps.ver.outputs.full }}
          path: esp32_hub/app/build/app/outputs/flutter-apk/esp32_hub-*.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.full }}
          name: ESP32 Hub ${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.full }})
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: esp32_hub/app/build/app/outputs/flutter-apk/esp32_hub-*.apk
